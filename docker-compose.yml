services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_ticket_backend
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=sqlite:///./support_tickets.db
      - SECRET_KEY=support-ticket-super-secret-production-key-change-in-env-9921
    volumes:
      - ./app/uploads:/app/app/uploads
      - ./support_tickets.db:/app/support_tickets.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: support_ticket_frontend
    ports:
      - "3005:80"
    depends_on:
      - backend
    restart: always
